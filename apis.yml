apis:
- aid: ximilar:ximilar
  name: Ximilar API
  description: 'The Ximilar REST API at https://api.ximilar.com. One account token in an ''Authorization:
    Token'' header unlocks every service the active plan includes: fashion, home-decor and photo tagging,
    collectibles recognition and AI card grading, visual and text-to-image search over your own collections,
    OCR, background removal, image upscaling, product-description generation, and the Computer Vision
    Platform for training custom classification, regression, detection, similarity and vision-language
    models. Requests and responses are JSON, images arrive as _url or _base64 records, up to ten records
    per call, and long jobs can be run through the asynchronous request API with a webhook callback.'
