aid: ximilar
name: Ximilar
description: Ximilar is a Czech visual-AI company that sells computer vision as a REST API and a no-code
  platform. Its api.ximilar.com surface covers image recognition and tagging (fashion, home decor, stock
  photo), collectibles AI (trading-card, sports-card and comic identification, AI card grading and TCG
  price search), visual search and similarity (reverse image search, product matching, multimodal text-to-image),
  OCR, background removal and image upscaling, plus a Computer Vision Platform for training custom classification,
  regression, detection and vision-language models and chaining them with Flows. Everything is billed
  in API credits against a monthly plan allowance, authenticated with a single account token, and callable
  synchronously or through an asynchronous request API with webhook callbacks. Ximilar also publishes
  a first-party Python SDK and a local MCP server exposing eleven of its services to LLM clients.
