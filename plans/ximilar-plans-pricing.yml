    operation: Read text via OCR and analyze with GPT
    credits: 15
  - service: Background Removal
    operation: Remove background (fast)
    credits: 10
  - service: Background Removal
    operation: Remove background (precise)
    credits: 50
  - service: Upscaler Classic
    operation: Upscale Image XS
    credits: 20
  - service: Upscaler GAN
    operation: Upscale Image UNLIMITED
    credits: 1536
  - service: Visual Search
    operation: Visual search (internal query)
    credits: 1
  - service: Visual Search
    operation: Visual search (external query)
    credits: 10
  - service: Visual Search
    operation: Sync your database to Ximilar
    credits: 3000
  - service: Vision Language Model
    operation: Train VLM LoRA 4B Small
    credits: 30000
  note: Sample only — the pricing page publishes a full credit-value table for every operation.
