description: 'Real, provider-published plans and pricing for Ximilar, read from https://www.ximilar.com/pricing/
  (HTTP 200) on 2026-08-28. This file REPLACES a 2026-05-04 scaffold whose tiers and prices were placeholder
  values. Ximilar sells a credit ladder, not a request ladder: every plan buys a monthly API credit allowance
  and each operation consumes a published number of credits (see billing_model). Monthly EUR prices are
  the headline; USD equivalents are published alongside. A yearly billing toggle exists on the page but
  no yearly prices were rendered in the fetched HTML, so none are recorded here.'
billing_model:
  unit: API credit
  description: Pricing is based on API method calls, with each request consuming a number of credits that
    depends on the operation. Only calls that send or upload an image for AI analysis consume credits;
    all other methods are free of charge.
  top_ups: Credit packs can be purchased on top of the monthly allowance on Business and Professional
    plans.
  tracking: https://app.ximilar.com/dashboard
  source: https://docs.ximilar.com/quickstart
  sample_credit_values:
  - service: Fashion Tagging
    operation: Region identification
    credits: 1
  - service: Fashion Tagging
    operation: Tag all fashion items
    credits: 60
  - service: AI Recognition of Collectibles
    operation: Identify a TCG card
    credits: 10
  - service: AI Card Grading
    operation: Grade a card
    credits: 100
  - service: AI Product Description
    operation: Description Generation
    credits: 100
  - service: OCR
    operation: Read text via OCR
    credits: 5
