source: https://demo.ximilar.com/ + https://www.ximilar.com/pricing/ + https://docs.ximilar.com/quickstart
provider: Ximilar
providerId: ximilar
description: >-
  Ximilar ships no test/live key separation and no sandbox environment. There is one
  production API host, one account token, and every call is billed in credits. What it does
  publish is (a) a public no-signup demo application where the marquee services can be run
  in a browser, (b) a Free plan with a real monthly credit allowance that acts as the
  evaluation path, and (c) published example image URLs used verbatim in the docs, which are
  the closest thing to fixtures on this API. Nothing below is invented — every value is
  copied from the provider's own pages.
test_live_separation:
  supported: false
  key_prefixes: none
  modes: none
  note: >-
    One token, one host (https://api.ximilar.com). There is no test-mode key, no sandbox
    subdomain and no simulation flag. An agent cannot rehearse a call for free once the free
    credits are spent.
demo:
  url: https://demo.ximilar.com/
  http_status: 200
  signup_required: false
  description: >-
    Hosted browser demo of the Ximilar services — upload or pick an image and see the live
    result. Linked from the marketing site as "Try Demo".
  known_surfaces:
    - https://demo.ximilar.com/collectibles-recognition
    - https://demo.ximilar.com/search-by-photo
